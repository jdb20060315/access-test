<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园跑打卡</title>
<style>
body{font:16px/1.7 system-ui;background:#f2f7f4;color:#183b31;margin:0}
main{max-width:560px;margin:24px auto;padding:20px}
form,section{background:white;padding:22px;border-radius:14px;margin:16px 0}
label{display:block;margin-top:12px}
input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b6cbc0;border-radius:8px}
input[type=checkbox]{width:auto}
button{background:#147956;color:white;margin-top:16px;cursor:pointer}
button:disabled{opacity:.5}
#mapSection{display:none}
#mapSection.show{display:block}
.map-wrap{border:1px solid #b6cbc0;border-radius:8px;padding:12px;background:#f8faf9}
.map-wrap.fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;max-width:none;margin:0;border-radius:0;z-index:99999;background:white;box-sizing:border-box;padding:14px;display:flex;flex-direction:column}
.map-box{width:100%;height:70vh;border-radius:6px;border:1px solid #ccd9d2;margin-top:8px}
.map-wrap.fullscreen .map-box{flex:1;height:auto;min-height:0}
.map-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.map-btn{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#147956;color:white;border-radius:6px}
.map-tip{font-size:13px;color:#557065;margin:8px 0 0}
.marker-badge{background:#d97706;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.5);border:2px solid white}
.route-info{background:#e8f0ec;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:14px}
</style>
<main>
<h1>校园跑打卡</h1>
<form id="form">
<label for="username">运动世界手机号</label>
<input id="username" type="tel" inputmode="numeric" required pattern="1[3-9][0-9]{9}" maxlength="11">
<label for="password">密码</label>
<input id="password" type="password" required maxlength="256">
<label for="school_name">学校名称（全称）</label>
<input id="school_name" placeholder="例如：黔东南民族职业技术学院" required maxlength="64">
<label for="latitude">指南针北纬</label>
<input id="latitude" placeholder="打开手机指南针看北纬" required maxlength="48">
<label for="longitude">指南针东经</label>
<input id="longitude" placeholder="如 107.9308" required maxlength="48">
<label for="distance">想跑多远（2–3 km）</label>
<input id="distance" type="number" min="2" max="3" step="0.1" value="2.2" required>
<label for="run_minutes">想跑多少分钟</label>
<input id="run_minutes" type="number" min="8" max="45" value="15" required>
<p id="paceInfo" style="font-size:13px;color:#557065"></p>
<label><input id="consent" type="checkbox" required> 这是我的账号，我同意服务器处理本次账号密码并提交模拟跑步记录。</label>
<p>提交后系统自动登录运动世界，拉取学校真实打卡点，沿真实道路自动规划完整路线，在卫星地图上展示。确认路线无误后点击确认提交。</p>
<button id="startBtn" type="button">▶ 开始跑步打卡</button>
</form>

<section id="mapSection">
<div class="map-wrap" id="mapWrap">
  <div class="map-bar" id="mapBar">
    <span style="font-weight:bold;font-size:14px;color:#147956">🗺️ 学校真实打卡路线</span>
    <button class="map-btn" id="btnToggleExpand" type="button" style="background:#0d6efd">⛶ 全屏</button>
  </div>
  <div id="amapContainer" class="map-box"></div>
  <div class="route-info" id="routeInfo"></div>
  <p class="map-tip">👆 以上路线由高德沿校园真实道路自动规划，按 1→2→3→4→5 顺序经过所有打卡点，不穿建筑。</p>
  <button id="confirmBtn" type="button" style="background:#d97706;font-weight:bold;font-size:16px;margin-top:10px">✅ 确认提交（按此路线打卡）</button>
</div>
</section>

<section id="statusSection" style="display:none">
<p id="status" role="status"></p>
<p id="result"></p>
</section>
</main>
<script src="https://webapi.amap.com/maps?v=1.4.15&key=8134837038215d9166be3f78afa1de56"></script>
<script>
const csrf='__CSRF__',el=id=>document.getElementById(id);
let aMap=null,aMarkers=[],aPolyline=null,aSat=null,aRoad=null;
let routeData=null,routePolyline=[];let preparing=false,confirming=false;

function parseCoord(v){if(!v)return null;v=String(v).trim().toUpperCase().replace('北纬','N').replace('南纬','S').replace('东经','E').replace('西经','W');const d=(v.match(/[NSEW]/g)||[])[0];v=v.replace(/[NSEW]/g,'').trim().replace(/[°度]$/,'');let n=parseFloat(v);return isNaN(n)?null:(d==='S'||d==='W'?-n:n);}
function w2g(lat,lon){let x=lon-105,y=lat-35;let dLa=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));dLa+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;dLa+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;dLa+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;let dLo=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));dLo+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;dLo+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;dLo+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;let r=lat/180*Math.PI,m=1-.00669342162296594323*Math.sin(r)**2;return[lat+dLa*180/((6335552.717/(m*Math.sqrt(m)))*Math.PI),lon+dLo*180/((6378245/Math.sqrt(m)*Math.cos(r))*Math.PI)];}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,dLa=(lat2-lat1)*Math.PI/180,dLo=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function estimate(){const d=+el('distance').value||0,m=+el('run_minutes').value||0;el('paceInfo').textContent=d>=2&&m>=8?`配速约 ${Math.floor(m*60/d/60)}:${String(Math.round(m*60/d)%60).padStart(2,'0')}/km`:'';}
['distance','run_minutes'].forEach(id=>el(id).addEventListener('input',estimate));estimate();

function fields(){return{username:el('username').value.trim(),password:el('password').value,consent:el('consent').checked,school_name:el('school_name').value.trim(),latitude:el('latitude').value.trim(),longitude:el('longitude').value.trim(),distance_km:el('distance').value,run_minutes:el('run_minutes').value};}

el('startBtn').onclick=async()=>{
  if(preparing)return;
  const f=fields();
  if(!f.username||!f.password||!f.school_name||!f.latitude||!f.longitude){alert('请填完整。');return;}
  if(!f.consent){alert('请勾选同意。');return;}
  preparing=true;el('startBtn').disabled=true;el('startBtn').textContent='⏳ 正在登录、拉取点位、规划路线（约 10 秒）…';
  try{
    const r=await fetch('/api/points',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(f)});
    const d=await r.json();
    if(!r.ok||!d.ok||!d.points||!d.points.length){
      const em={device_conflict:'❌ 手机 App 未退出！先去 App → 设置 → 退出登录。',login_failed:'❌ 登录失败，请核对手机号密码。',points_unavailable:'❌ 学校未开放点位。'};
      throw Error(em[d.failure]||d.failure||'获取失败');
    }
    routeData=d;
    showMap(d.points,d.route);
  }catch(e){alert(e.message||'获取失败');}
  finally{preparing=false;el('startBtn').disabled=false;el('startBtn').textContent='▶ 开始跑步打卡';}
};

function showMap(points,route){
  el('mapSection').classList.add('show');
  el('mapSection').scrollIntoView({behavior:'smooth'});
  if(!aMap){
    aSat=new AMap.TileLayer.Satellite();aRoad=new AMap.TileLayer.RoadNet();
    aMap=new AMap.Map('amapContainer',{zoom:18,center:[points[0].lng,points[0].lat],layers:[aSat,aRoad],resizeEnable:true});
  }
  aMarkers.forEach(m=>m.setMap(null));aMarkers=[];
  if(aPolyline){aPolyline.setMap(null);aPolyline=null;}
  routePolyline=route.polyline||[];
  routePolyline.forEach((p,i)=>{
    const mk=new AMap.Marker({map:aMap,position:[p[0],p[1]],content:`<div class="marker-badge">${i+1}</div>`,offset:new AMap.Pixel(-14,-14),title:points[i]?points[i].name:'打卡点'});
    aMarkers.push(mk);
  });
  if(routePolyline.length>1){
    aPolyline=new AMap.Polyline({map:aMap,path:routePolyline,strokeColor:'#147956',strokeWeight:6,strokeOpacity:.9,lineJoin:'round',showDir:true});
  }
  const totalKm=(route.total_m/1000).toFixed(2);
  const segInfo=(route.segments||[]).map(s=>`${s.from}→${s.to}（${s.dist}m）`).join('，');
  el('routeInfo').innerHTML=`📏 沿真实道路总距离：<b>${totalKm} km</b><br>路线：${segInfo}<br>💡 实际距离可能略超目标，系统会自动调整配速。`;
  el('confirmBtn').disabled=false;
  setTimeout(()=>{if(aMap.checkResize)aMap.checkResize();},300);
}

el('btnToggleExpand').onclick=()=>{const w=el('mapWrap');w.classList.toggle('fullscreen');document.body.style.overflow=w.classList.contains('fullscreen')?'hidden':'';setTimeout(()=>{if(aMap&&aMap.checkResize)aMap.checkResize();},150);};
el('mapBar').ondblclick=()=>el('btnToggleExpand').click();

el('confirmBtn').onclick=async()=>{
  if(confirming)return;
  confirming=true;el('confirmBtn').disabled=true;el('confirmBtn').textContent='⏳ 正在提交…';
  el('statusSection').style.display='block';el('status').textContent='正在提交跑步记录…';
  try{
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(fields())});
    const d=await r.json();
    if(r.ok){el('status').textContent='已接受，等待结果…';pollStatus();}
    else{el('status').textContent='提交失败：'+(d.failure||'未知');}
  }catch(e){el('status').textContent='连接中断。';}
  finally{confirming=false;el('confirmBtn').disabled=false;el('confirmBtn').textContent='✅ 确认提交';}
};
async function pollStatus(){
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,5000));
    try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();
      if(!d.busy&&d.report){const p=d.report;el('result').textContent=p.record_uploaded===true?'✅ 提交成功！打开手机运动世界 App 查看。':p.record_uploaded===null?'结果未知。':'❌ 未成功。';return;}
    }catch{}
  }
  el('result').textContent='等待超时。';
}
</script></html>
