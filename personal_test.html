<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园账号测试</title>
<style>body{font:16px/1.7 system-ui;background:#f2f7f4;color:#183b31;margin:0}main{max-width:560px;margin:24px auto;padding:20px}form,section{background:white;padding:22px;border-radius:14px;margin:16px 0}label{display:block;margin-top:12px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b6cbc0;border-radius:8px}input[type=checkbox]{width:auto}button{background:#147956;color:white;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}</style>
<main><h1>校园账号测试</h1><p>首次使用请打开手机「指南针」，站在本校跑步区域，填写城市、北纬和东经。以下提交的是模拟记录，不代表实际完成跑步。</p><form id="form"><label for="username">运动世界手机号</label><input id="username" type="tel" inputmode="numeric" autocomplete="username" required pattern="1[3-9][0-9]{9}" maxlength="11"><label for="password">密码</label><input id="password" type="password" autocomplete="off" required maxlength="256"><label for="city">学校所在城市</label><input id="city" autocomplete="address-level2" placeholder="例如：哈尔滨市" required maxlength="32"><label for="latitude">指南针北纬</label><input id="latitude" inputmode="text" placeholder="例如：45.86 或 北纬45°51′36″" required maxlength="48"><label for="longitude">指南针东经</label><input id="longitude" inputmode="text" placeholder="例如：126.56 或 东经126°33′36″" required maxlength="48"><label for="distance">距离（2–3 km）</label><input id="distance" type="number" min="2" max="3" step="0.01" value="2.26" required><label for="cadence">实测步频（每分钟步数）</label><input id="cadence" type="number" min="140" max="200" step="1" placeholder="填本人实测值" required><label for="stepLength">实测步幅（每步米数）</label><input id="stepLength" type="number" min="0.7" max="1.5" step="0.01" placeholder="填本人实测值" required><p id="estimate" role="status"></p><p>时间按距离 ÷（步频 × 每步步幅）估算。上下振幅不能直接推算速度；这里不会读取手机传感器，也不会验证实际运动。</p><label><input id="consent" type="checkbox" required> 这是我的账号，我同意服务器处理本次账号密码，并执行登录、提交一条模拟记录、查询和退出。</label><p>勾选记住后，账号、密码和设置会加密保存在服务器，30 天内在同一浏览器可复用；密码不会回填到页面。清除浏览器数据或更换浏览器后需要重新填写。检测结果和设置保存在境外。请先退出手机 App；上次操作完成且确认退出后可以再次提交。提交结果不明时不会自动重试。</p><label><input id="remember" type="checkbox"> 记住账号、密码、位置和运动参数（仅在本人设备使用）</label><button id="saveSettings" type="button" disabled>保存设置（不提交记录）</button><button id="forgetSettings" type="button" hidden>清除已保存设置</button><p id="savedStatus" role="status"></p><button id="run" disabled>提交一次模拟记录</button></form><section><p id="status" role="status">正在读取状态…</p><p id="result"></p><button id="logout" hidden>核对云端退出</button></section></main>
<script>const csrf='__CSRF__',el=id=>document.getElementById(id);let submitting=false,stopped=false,profileLoaded=false,savedUsername='';
const feedback=document.createElement('p');feedback.id='feedback';feedback.setAttribute('role','alert');el('status').before(feedback);
el('form').addEventListener('invalid',e=>{const label=document.querySelector(`label[for="${e.target.id}"]`);feedback.textContent=`请检查${label?label.textContent:'必填项'}：${e.target.validationMessage}`;},true);
const errors={saved_settings_unavailable:'已保存设置不可用，请重新填写并保存。',remember_consent_required:'请勾选记住账号和设置。',busy:'本次操作正在进行，请稍后查看。',capacity_unavailable:'服务器资源暂时不足，请稍后重试；本次没有开始。',already_reserved:'该账号上次操作结果未知，或云端退出未确认；暂不能重复提交。',account_or_consent_required:'请检查手机号与账号授权。',invalid_location:'请核对城市、北纬和东经，按指南针显示填写。',invalid_running_parameters:'请填写 2–3 km、140–200 步/分和 0.7–1.5 米/步。',session_expired:'页面会话已过期，请刷新。',private_setup_required:'服务尚未就绪。'};
function estimate(){const d=Number(el('distance').value),c=Number(el('cadence').value),s=Number(el('stepLength').value);el('estimate').textContent=d>=2&&d<=3&&c>=140&&c<=200&&s>=.7&&s<=1.5?`估算用时约 ${Math.ceil(d*1000/(c*s))} 分钟；实际以运动记录为准。`:'请填写有效的距离、步频和步幅。';}['distance','cadence','stepLength'].forEach(id=>el(id).addEventListener('input',estimate));estimate();

function updatePassword(){const saved=!!savedUsername&&el('username').value.trim()===savedUsername;el('password').required=!saved;el('password').placeholder=saved?'已记住；留空即可复用，填写可更新密码':'请输入密码';}
el('username').addEventListener('input',updatePassword);
function requestFields(){return {username:el('username').value.trim(),password:el('password').value,consent:el('consent').checked,city:el('city').value.trim(),latitude:el('latitude').value.trim(),longitude:el('longitude').value.trim(),distance_km:el('distance').value,cadence:el('cadence').value,step_length_m:el('stepLength').value,remember:el('remember').checked,use_saved:!el('password').value&&!!savedUsername&&el('username').value.trim()===savedUsername};}
async function loadSettings(){try{const r=await fetch('/api/profile',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();savedUsername=d.saved?d.fields.username:'';if(d.saved){for(const [id,key]of Object.entries({username:'username',city:'city',latitude:'latitude',longitude:'longitude',distance:'distance_km',cadence:'cadence',stepLength:'step_length_m'}))el(id).value=d.fields[key];el('remember').checked=true;}el('forgetSettings').hidden=!d.saved;el('savedStatus').textContent=d.saved?'已恢复账号和设置，密码无需重新输入。':'保存一次后，下次在此浏览器可直接复用。';updatePassword();estimate();}catch{el('savedStatus').textContent='暂时无法读取已保存设置；可以稍后刷新。';}finally{profileLoaded=true;el('saveSettings').disabled=false;await refresh();}}
el('saveSettings').onclick=async()=>{if(!profileLoaded||submitting)return;submitting=true;el('saveSettings').disabled=true;const body=requestFields();try{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(errors[d.failure]||'保存失败，请稍后再试。');savedUsername=body.username;el('password').value='';el('forgetSettings').hidden=false;updatePassword();el('savedStatus').textContent='已加密保存，下次无需重新填写；本次没有提交运动记录。';}catch(e){el('savedStatus').textContent=e.message||'保存结果未确认，请刷新查看。';}finally{body.password='';submitting=false;el('saveSettings').disabled=false;await refresh();}};
el('forgetSettings').onclick=async()=>{if(submitting)return;submitting=true;el('forgetSettings').disabled=true;try{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({forget:true})});if(!r.ok)throw Error();savedUsername='';el('remember').checked=false;el('password').value='';el('forgetSettings').hidden=true;updatePassword();el('savedStatus').textContent='服务器已清除保存的账号、密码和设置；已有任务及退出状态保留。';}catch{el('savedStatus').textContent='未确认清除成功，请稍后重试。';}finally{submitting=false;el('forgetSettings').disabled=false;await refresh();}};
function loginFailure(p){if(p.failure!=='login_failed')return '';const labels={captcha:'登录返回涉及验证码',decrypt:'登录响应解密失败',signature:'登录返回涉及签名校验',network:'登录期间出现网络连接错误',panic:'登录程序异常',device_risk:'登录返回涉及设备风险'};const details=(Array.isArray(p.login_diagnostic_tags)?p.login_diagnostic_tags:[]).filter(tag=>Object.hasOwn(labels,tag)).map(tag=>labels[tag]);for(const [field,label]of [['login_error_codes','错误码'],['http_status_codes','HTTP 状态']]){const codes=(Array.isArray(p[field])?p[field]:[]).filter(Number.isSafeInteger).slice(0,10);if(codes.length)details.push(`${label}：${codes.join('、')}`);}return '账号登录失败。'+(details.length?details.join('；')+'。':'未返回可识别的错误原因，不能据此判断密码错误。');}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!d.reserved)stopped=false;el('run').disabled=!profileLoaded||submitting||d.busy||d.reserved;el('logout').hidden=!d.logout_available;el('logout').disabled=d.busy;el('status').textContent=d.busy?'正在处理本次操作，请等待…':d.reserved?'已有预约，结果暂未确认。请勿重复提交。':d.report?'上次操作已结束，可以再次提交。':'可以提交本次测试。';if(d.report){const p=d.report;el('result').textContent=(p.record_uploaded===true?(p.valid_credit_verified===true?'已确认有效里程增加。请在手机 App 核对成绩。':'记录已上传，但未确认有效里程增加；请在手机 App 查看未达标条件，不能算作有效跑步。'):p.record_uploaded===null?'提交结果无法确认，请勿重试。':'未确认提交成功。'+loginFailure(p))+(p.remote_logout?' 云端退出已确认。':p.session_retained?' 云端退出尚未确认，请使用下方按钮核对。':'');}}catch{el('run').disabled=true;el('status').textContent='状态暂时无法读取，请恢复连接后查看，不要重复操作。';}}
el('form').onsubmit=async e=>{e.preventDefault();if(!profileLoaded||submitting||stopped)return;submitting=true;el('run').disabled=true;feedback.textContent='';const body=requestFields();let message='',accepted=false;try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});body.password='';const d=await r.json();accepted=r.ok;if(r.ok&&body.remember){savedUsername=body.username;el('forgetSettings').hidden=false;updatePassword();el('savedStatus').textContent='账号和设置已加密保存。';}stopped=r.ok||(r.status===503&&d.failure!=='capacity_unavailable');if(r.ok||stopped)el('password').value='';message=r.ok?'已接受本次操作，请等待。':errors[d.failure]||'请求结果未确认，请勿重复提交。';}catch{stopped=true;el('password').value='';message='连接中断，结果未知；请恢复连接查看。';}finally{body.password='';submitting=false;await refresh();if(accepted)el('status').textContent=message;else feedback.textContent=message;}};
el('logout').onclick=async()=>{el('logout').disabled=true;try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'});}finally{await refresh();}};loadSettings();setInterval(refresh,5000);
</script></html>
