<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动世界 · 个人账号检测</title>
<style>body{font:16px/1.7 system-ui;background:#f2f7f4;color:#183b31;margin:0}main{max-width:560px;margin:24px auto;padding:20px}form,section{background:white;padding:22px;border-radius:14px;margin:16px 0}label{display:block;margin-top:12px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b6cbc0;border-radius:8px}input[type=checkbox]{width:auto}button{background:#147956;color:white;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><h1>个人账号检测</h1><p>检测登录、查询学期和退出状态。本页不会生成或上传运动记录。</p><form id="form"><label for="username">运动世界账号</label><input id="username" autocomplete="username" required maxlength="128"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><label><input id="consent" type="checkbox" required> 我同意由 Render 上的本次测试程序处理账号密码，并向运动世界发送登录、查询和退出请求。</label><p>密码不保存到项目文件或数据库。脱敏检测结果和必要的加密临时会话保存在 Neon。本入口只允许你的账号检测一次，异常不自动重试。</p><button id="check">开始账号检测并自动退出</button></form><section><p id="status" role="status">正在读取状态…</p><pre id="report" hidden></pre><button id="logout" hidden>再次核对云端退出</button></section></main>
<script>const csrf='__CSRF__',el=id=>document.getElementById(id);let submitting=false,stopped=false;
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();el('check').disabled=submitting||d.busy||d.reserved;el('logout').hidden=!d.logout_available;el('logout').disabled=d.busy;el('status').textContent=d.busy?'正在检测，请等待…':d.report?(d.report.remote_logout?'检测完成，云端退出已确认。':'检测结束，云端退出尚未确认。'):d.reserved?'已有预约记录，结果暂未确认。不会重复登录。':'可以开始本次个人账号检测。';if(d.report){el('report').hidden=false;el('report').textContent=JSON.stringify(d.report,null,2);}}catch{el('check').disabled=true;el('status').textContent='状态暂时无法读取，请恢复连接后查看，不要重复操作。';}}
el('form').onsubmit=async e=>{e.preventDefault();if(submitting||stopped)return;submitting=true;el('check').disabled=true;const body={username:el('username').value.trim(),password:el('password').value,consent:el('consent').checked};el('password').value='';try{const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});body.password='';if(!r.ok){stopped=true;el('status').textContent='请求未确认，请查看检测状态，不要重复点击。';}else stopped=true;}catch{stopped=true;el('status').textContent='连接中断，结果未知；请恢复连接查看。';}finally{body.password='';submitting=false;await refresh();}};
el('logout').onclick=async()=>{el('logout').disabled=true;try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'});}finally{await refresh();}};refresh();setInterval(refresh,5000);
</script></html>
