<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园账号测试</title>
<style>body{font:16px/1.7 system-ui;background:#f2f7f4;color:#183b31;margin:0}main{max-width:560px;margin:24px auto;padding:20px}form,section{background:white;padding:22px;border-radius:14px;margin:16px 0}label{display:block;margin-top:12px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b6cbc0;border-radius:8px}input[type=checkbox]{width:auto}button{background:#147956;color:white;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}</style>
<main><h1>校园账号测试</h1><p>首次使用请打开手机「指南针」，站在本校跑步区域，填写城市、北纬和东经。以下提交的是模拟记录，不代表实际完成跑步。</p><form id="form"><label for="username">运动世界手机号</label><input id="username" type="tel" inputmode="numeric" autocomplete="username" required pattern="1[3-9][0-9]{9}" maxlength="11"><label for="password">密码</label><input id="password" type="password" autocomplete="off" required maxlength="256"><label for="city">学校所在城市</label><input id="city" autocomplete="address-level2" placeholder="例如：哈尔滨市" required maxlength="32"><label for="latitude">指南针北纬</label><input id="latitude" inputmode="text" placeholder="例如：45.86 或 北纬45°51′36″" required maxlength="48"><label for="longitude">指南针东经</label><input id="longitude" inputmode="text" placeholder="例如：126.56 或 东经126°33′36″" required maxlength="48"><label for="distance">距离（2–3 km）</label><input id="distance" type="number" min="2" max="3" step="0.01" value="2.26" required><label for="cadence">实测步频（每分钟步数）</label><input id="cadence" type="number" min="140" max="200" step="1" placeholder="填本人实测值" required><label for="stepLength">实测步幅（每步米数）</label><input id="stepLength" type="number" min="0.7" max="1.5" step="0.01" placeholder="填本人实测值" required><p id="estimate" role="status"></p><p>时间按距离 ÷（步频 × 每步步幅）估算。上下振幅不能直接推算速度；这里不会读取手机传感器，也不会验证实际运动。</p><label><input id="consent" type="checkbox" required> 这是我的账号，我同意服务器处理本次账号密码，并执行登录、提交一条模拟记录、查询和退出。</label><p>密码不保存。提交时填写的位置只用于这次操作；未确认退出时会随临时会话加密保存。检测结果和临时会话保存在境外。请先退出手机 App；同一账号当天只能预约一次，提交结果不明时不会自动重试。</p><button id="run">提交一次模拟记录</button></form><section><p id="status" role="status">正在读取状态…</p><p id="result"></p><button id="logout" hidden>核对云端退出</button></section></main>
<script>const csrf='__CSRF__',el=id=>document.getElementById(id);let submitting=false,stopped=false;
const errors={busy:'当前有人操作，请稍后再试。',already_reserved:'该账号上次操作结果未知，或云端退出未确认；暂不能重复提交。',account_or_consent_required:'请检查手机号与账号授权。',invalid_location:'请核对城市、北纬和东经，按指南针显示填写。',invalid_running_parameters:'请填写 2–3 km、140–200 步/分和 0.7–1.5 米/步。',session_expired:'页面会话已过期，请刷新。',private_setup_required:'服务尚未就绪。'};
function estimate(){const d=Number(el('distance').value),c=Number(el('cadence').value),s=Number(el('stepLength').value);el('estimate').textContent=d>=2&&d<=3&&c>=140&&c<=200&&s>=.7&&s<=1.5?`估算用时约 ${Math.ceil(d*1000/(c*s))} 分钟；实际以运动记录为准。`:'请填写有效的距离、步频和步幅。';}['distance','cadence','stepLength'].forEach(id=>el(id).addEventListener('input',estimate));estimate();
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!d.reserved)stopped=false;el('run').disabled=submitting||d.busy||d.reserved;el('logout').hidden=!d.logout_available;el('logout').disabled=d.busy;el('status').textContent=d.busy?'正在处理本次操作，请等待…':d.reserved?'已有预约，结果暂未确认。请勿重复提交。':d.report?'上次操作已结束，可以再次提交。':'可以提交本次测试。';if(d.report){const p=d.report;el('result').textContent=(p.record_uploaded===true?'已收到提交成功响应。请登录手机 App 核对记录是否有效及进度是否增加。':p.record_uploaded===null?'提交结果无法确认，请勿重试。':'未确认提交成功。'+(p.failure==='login_failed'?'账号登录失败。':''))+(p.remote_logout?' 云端退出已确认。':p.session_retained?' 云端退出尚未确认，请使用下方按钮核对。':'');}}catch{el('run').disabled=true;el('status').textContent='状态暂时无法读取，请恢复连接后查看，不要重复操作。';}}
el('form').onsubmit=async e=>{e.preventDefault();if(submitting||stopped)return;submitting=true;el('run').disabled=true;const body={username:el('username').value.trim(),password:el('password').value,consent:el('consent').checked,city:el('city').value.trim(),latitude:el('latitude').value.trim(),longitude:el('longitude').value.trim(),distance_km:el('distance').value,cadence:el('cadence').value,step_length_m:el('stepLength').value};el('password').value='';let message='';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});body.password='';const d=await r.json();stopped=r.ok||r.status===503;message=r.ok?'已接受本次操作，请等待。':errors[d.failure]||'请求结果未确认，请勿重复提交。';}catch{stopped=true;message='连接中断，结果未知；请恢复连接查看。';}finally{body.password='';submitting=false;await refresh();if(message)el('status').textContent=message;}};
el('logout').onclick=async()=>{el('logout').disabled=true;try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'});}finally{await refresh();}};refresh();setInterval(refresh,5000);
</script></html>
